name: Publish Skills to ClawHub

on:
  push:
    branches: [main]
    paths:
      - 'skills/**'
  workflow_dispatch:
    inputs:
      skill:
        description: 'Skill slug to publish (leave empty to auto-detect changed skills)'
        required: false
      version:
        description: 'Version override (leave empty to read from skill config)'
        required: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install ClawHub CLI
        run: npm install -g clawhub

      - name: Login to ClawHub
        run: clawhub login --token ${{ secrets.CLAWHUB_TOKEN }}

      - name: Detect changed skills
        id: detect
        run: |
          if [ -n "${{ github.event.inputs.skill }}" ]; then
            echo "skills=${{ github.event.inputs.skill }}" >> $GITHUB_OUTPUT
            exit 0
          fi
          # Auto-detect: compare with previous commit
          CHANGED=$(git diff --name-only HEAD~1 HEAD -- 'skills/*/' | cut -d'/' -f2 | sort -u | tr '\n' ',')
          echo "skills=${CHANGED%,}" >> $GITHUB_OUTPUT
          echo "Detected changed skills: ${CHANGED%,}"

      - name: Publish skill
        run: |
          SKILLS="${{ steps.detect.outputs.skills }}"
          if [ -z "$SKILLS" ]; then
            echo "No skills to publish"
            exit 0
          fi

          # Skill registry: slug -> display name
          declare -A SLUGS=(
            ["china-hotel-price-compare"]="酒店比价"
            ["china-flight-price-compare"]="机票比价"
            ["global-hotel-search-recommend"]="全球酒店搜索与推荐"
            ["global-flight-search"]="全球航班查询与预订"
            ["gaode-map-pro"]="高德地图全能版"
            ["gaode-taxi"]="高德打车"
            ["meituan-travel-assistant"]="美团旅行助手"
            ["tongcheng-travel-assistant"]="同程旅行助手"
            ["tuniu-travel-assistant"]="途牛旅行助手"
            ["fliggy-travel"]="飞猪旅行助手"
          )

          IFS=',' read -ra SKILL_LIST <<< "$SKILLS"
          for skill in "${SKILL_LIST[@]}"; do
            slug="$skill"
            name="${SLUGS[$skill]:-$skill}"
            skill_dir="./skills/$skill"

            if [ ! -d "$skill_dir" ]; then
              echo "⚠️ Skill dir not found: $skill_dir, skipping"
              continue
            fi

            # Read version from version file, or use input, or default
            if [ -n "${{ github.event.inputs.version }}" ]; then
              version="${{ github.event.inputs.version }}"
            elif [ -f "$skill_dir/version" ]; then
              version=$(cat "$skill_dir/version" | tr -d '[:space:]')
            else
              echo "⚠️ No version file for $skill, skipping"
              continue
            fi

            echo "📦 Publishing $slug @ $version ($name)"
            clawhub skill publish "$skill_dir" \
              --owner travel-skills \
              --slug "$slug" \
              --name "$name" \
              --version "$version" \
              || echo "⚠️ Publish failed for $slug (may already exist at this version)"
          done
